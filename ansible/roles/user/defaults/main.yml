---
hermes_user: hermes
hermes_user_shell: /bin/bash
hermes_user_groups:
  - sudo

# Public keys authorized for the hermes user. Both keys currently on the
# production host are listed; add here rather than out-of-band so the set is
# reproducible on a rebuild.
hermes_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINh3vrq0q6G1P84MspDmsA6tygUvg4lZPtjGKMHpWd5p cdqt98@gmail.com"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILIazEuQtZJEgBOVphYpWHMwD/sA3V4EPmacv43ioQX7 Generated By Termius"

# Written to ~/.bashrc. Secrets do NOT belong here — see hermes_user_env_file.
hermes_user_path_entries:
  - "$HOME/.local/bin"

# Secrets are sourced from a separate root-owned-but-user-readable file rather
# than inlined into .bashrc, which is how the production host leaked a GitHub PAT
# in plain text into a world-readable dotfile.
hermes_user_env_file: ".config/hermes-env"
hermes_user_env: {}
