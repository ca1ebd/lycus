---
# 22 is the current Node LTS and what 26.04 ships; 20 reaches end of life in
# 2026. Whatever this says, the pin in node.yml makes it actually take effect.
devtools_node_major: 22
devtools_terraform_version: "1.9.8"

devtools_install_node: true
devtools_install_uv: true
devtools_install_terraform: true
devtools_install_gh: true
devtools_install_azure_cli: true
devtools_install_claude_code: true
devtools_install_browsers: true

devtools_build_packages:
  - build-essential
  - python3-dev
  - python3-pip
  - python3-venv
  - ripgrep
  - ffmpeg
  - unzip
  - wireguard-tools

# Playwright's browsers are downloaded binaries, but they link against system
# libraries and fonts that must come from apt. This is the layer that matters —
# see the note in tasks/browsers.yml about why we do NOT install chromium itself
# from apt.
devtools_playwright_packages:
  - libnss3
  - libnspr4
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libcups2t64
  - libdrm2
  - libgbm1
  - libasound2t64
  - libatspi2.0-0t64
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libxkbcommon0
  - libpango-1.0-0
  - libcairo2
  - fonts-liberation
  - fonts-noto-color-emoji
  - fonts-unifont
  - xvfb

devtools_npm_globals:
  - "@devcontainers/cli"
