---
- name: Add the Microsoft apt key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"
  become: true

- name: Add the Azure CLI repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc]
      https://packages.microsoft.com/repos/azure-cli/ {{ ansible_distribution_release }} main
    filename: azure-cli
    state: present
  become: true

- name: Install the Azure CLI
  ansible.builtin.apt:
    name: azure-cli
    state: present
    update_cache: true
  become: true
