---
# Implements docs/swap-setup-spec.md. The point is not performance — it is that
# an OOM kill takes the gateway down instantly and loses conversation context,
# whereas swapping degrades gracefully and leaves time to react.
- name: Check for an existing swap file
  ansible.builtin.stat:
    path: "{{ base_swap_file }}"
  register: base_swap_stat

- name: Allocate the swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ base_swap_size_mb }}M {{ base_swap_file }}"
    creates: "{{ base_swap_file }}"
  become: true
  register: base_swap_allocated

- name: Restrict the swap file to root
  ansible.builtin.file:
    path: "{{ base_swap_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Format the swap file
  ansible.builtin.command: "mkswap {{ base_swap_file }}"
  become: true
  when: base_swap_allocated is changed
  changed_when: true

- name: Persist the swap file in fstab
  ansible.posix.mount:
    src: "{{ base_swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present
  become: true

- name: Read active swap devices
  ansible.builtin.command: swapon --show=NAME --noheadings
  become: true
  changed_when: false
  register: base_swap_active

- name: Activate the swap file
  ansible.builtin.command: "swapon {{ base_swap_file }}"
  become: true
  when: base_swap_file not in base_swap_active.stdout_lines
  changed_when: true

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ base_swappiness }}"
    sysctl_file: /etc/sysctl.d/99-hermes-swap.conf
    state: present
    reload: true
  become: true
