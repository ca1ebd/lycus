---
- name: Build a Lycus host
  hosts: lycus
  become: true
  gather_facts: true

  roles:
    - role: base
      tags: [base]
    - role: user
      tags: [user]
    - role: ssh_hardening
      tags: [ssh]
    - role: docker
      tags: [docker]
    - role: devtools
      tags: [devtools]
    - role: hermes
      tags: [hermes]
    # Never runs unless restore_archive is set. Provision and prove a clean host
    # first, then lay state on top of it.
    - role: restore
      tags: [restore, never]
