---
# Static inventory. The Terraform targets in ../terraform/<target>/ emit
# host_ip / ssh_user / ssh_private_key_path; `terraform output` fills this in.
all:
  children:
    lycus:
      hosts:
        lycus-homelab:
          ansible_host: 10.20.30.11
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lycus_vm_key
      vars:
        ansible_python_interpreter: /usr/bin/python3
