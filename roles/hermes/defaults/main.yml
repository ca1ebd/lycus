---
hermes_user: hermes
hermes_user_shell: /bin/bash
hermes_user_groups:
  - sudo

# Public keys authorized for the hermes user. Both keys currently on the
# production host are listed; add here rather than out-of-band so the set is
# reproducible on a rebuild.
hermes_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINh3vrq0q6G1P84MspDmsA6tygUvg4lZPtjGKMHpWd5p cdqt98@gmail.com"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILIazEuQtZJEgBOVphYpWHMwD/sA3V4EPmacv43ioQX7 Generated By Termius"

# Debian and Ubuntu ship the unit as ssh.service with no sshd alias; RHEL-family
# calls it sshd. Resolved from gathered facts so the role works on both, and
# overridable for anything unusual.
hermes_sshd_service: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"

hermes_install_script: "https://hermes-agent.nousresearch.com/install.sh"

# Set false to provision the user, SSH hardening and sudoers without running the
# Hermes installer. Molecule uses this: the installer pulls a full Python/Node
# toolchain over the network, which makes CI slow and non-deterministic, and the
# install itself is covered separately.
hermes_install_agent: true
